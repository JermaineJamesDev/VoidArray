name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, as X.Y.Z
        required: true

permissions:
  contents: read

env:
  RAW_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - run: chmod +x gradlew

      - name: Resolve version
        run: |
          version="${RAW_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like X.Y.Z (tag vX.Y.Z), got '$RAW_VERSION'"
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret ANDROID_KEYSTORE_BASE64 is missing. See docs/RELEASING.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease -PappVersion="$APP_VERSION"

      - name: Collect APK
        run: |
          mkdir dist
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "dist/VoidArray-$APP_VERSION.apk"
          # Fails the job if signing silently did not happen.
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "dist/VoidArray-$APP_VERSION.apk"
          cd dist && sha256sum "VoidArray-$APP_VERSION.apk" > "VoidArray-$APP_VERSION.apk.sha256"

      - name: Record signing certificate
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "dist/VoidArray-$APP_VERSION.apk"             | grep -E 'certificate (DN|SHA-256 digest)' > "dist/VoidArray-$APP_VERSION.apk.cert.txt"
          grep -q 'SHA-256 digest' "dist/VoidArray-$APP_VERSION.apk.cert.txt"
          cat "dist/VoidArray-$APP_VERSION.apk.cert.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-apk
          path: dist/

  windows:
    name: Windows installers and portable ZIP
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Resolve version
        run: |
          version="${RAW_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like X.Y.Z (tag vX.Y.Z), got '$RAW_VERSION'"
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build EXE, MSI and portable ZIP
        run: ./gradlew :desktopApp:packageExe :desktopApp:packageMsi :desktopApp:packagePortableZip -PappVersion="$APP_VERSION"

      - name: Collect files
        run: |
          mkdir dist
          cp desktopApp/build/compose/binaries/main/exe/*.exe "dist/VoidArray-$APP_VERSION-setup.exe"
          cp desktopApp/build/compose/binaries/main/msi/*.msi "dist/VoidArray-$APP_VERSION.msi"
          cp desktopApp/build/compose/binaries/main/portable/*.zip "dist/"
          cd dist
          for file in *; do sha256sum "$file" > "$file.sha256"; done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows
          path: dist/

  publish:
    name: Attest and attach to release
    if: github.event_name == 'release'
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.apk
            dist/*.exe
            dist/*.msi
            dist/*.zip

      - name: Upload files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
