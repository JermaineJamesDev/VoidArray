name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 

      - run: chmod +x gradlew

      - name: Test and build
        run: ./gradlew :engine:test :shared:jvmTest :desktopApp:compileKotlin :androidApp:assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a 
        with:
          name: test-reports
          path: '**/build/reports/tests/'
