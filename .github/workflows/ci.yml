name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad 
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 

      - run: chmod +x gradlew

      - name: Test and build
        run: ./gradlew :engine:test :shared:jvmTest :desktopApp:compileKotlin :androidApp:assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 
        with:
          name: test-reports
          path: '**/build/reports/tests/'
